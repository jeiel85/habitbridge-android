<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="HabitBridge — Intentional Friction &amp; Micro-Swap">
  <defs>
    <radialGradient id="bg" cx="20%" cy="0%" r="90%">
      <stop offset="0" stop-color="#14312a"/>
      <stop offset="0.55" stop-color="#0b0f0e"/>
      <stop offset="1" stop-color="#070a09"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="rgba(52,211,153,0.07)" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
  </g>

  <!-- bridge mark -->
  <g transform="translate(90 150)">
    <path d="M-40 40 q40 -90 80 0" fill="none" stroke="url(#mint)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="-40" cy="40" r="10" fill="#34d399"/>
    <circle cx="40" cy="40" r="10" fill="#34d399"/>
    <path d="M-40 40 v22 M40 40 v22" stroke="#34d399" stroke-width="4" opacity=".5"/>
  </g>

  <!-- title -->
  <text x="190" y="118" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#e6f4ef" letter-spacing="-1">HabitBridge</text>
  <text x="192" y="158" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="22" fill="#34d399" letter-spacing="2">INTENTIONAL FRICTION &amp; MICRO-SWAP</text>
  <text x="192" y="198" font-family="system-ui, 'Segoe UI', 'Noto Sans KR', sans-serif" font-size="17" fill="#a7bdb4">도파민을 무작정 막지 마세요. 가치 있는 마이크로 행동으로 스왑하세요. · 로컬 우선 · 서버 없음 · 1회 결제</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#34d399">
    <rect x="192" y="216" width="330" height="26" rx="13" fill="#0f1a17" stroke="#1f8f6a"/>
    <text x="206" y="234">▶ jeiel85.github.io/habitbridge-android</text>
  </g>

  <!-- phone with interceptor -->
  <g transform="translate(900 30)">
    <rect x="0" y="0" width="200" height="240" rx="26" fill="#000" stroke="#1c1c1e" stroke-width="8"/>
    <rect x="12" y="14" width="176" height="212" rx="16" fill="#060907"/>
    <rect x="12" y="14" width="176" height="20" rx="8" fill="#0d1512"/>
    <text x="22" y="28" font-family="Consolas, monospace" font-size="9" fill="#34d399">~/habitbridge/interceptor</text>
    <text x="22" y="54" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#fbbf24">[!] PAUSE AND REFLECT</text>
    <text x="22" y="70" font-family="Consolas, monospace" font-size="8" fill="#9fc5b5">Target: com.instagram.android</text>
    <text x="22" y="82" font-family="Consolas, monospace" font-size="8" fill="#9fc5b5">Mode  : Work (NORMAL)</text>
    <rect x="22" y="92" width="156" height="14" fill="none" stroke="#2a4a40" stroke-dasharray="3 2"/>
    <rect x="22" y="92" width="96" height="14" fill="rgba(52,211,153,.18)"/>
    <text x="28" y="102" font-family="Consolas, monospace" font-size="8" fill="#fbbf24">[ 00:02s HOLD ON... ]</text>
    <g font-family="Consolas, monospace" font-size="8" fill="#dff5ea">
      <rect x="22" y="114" width="156" height="18" rx="3" fill="#0c1411" stroke="#1f3a32"/><text x="28" y="126">[1] 1-Min Posture Reset</text>
      <rect x="22" y="136" width="156" height="18" rx="3" fill="#0c1411" stroke="#1f3a32"/><text x="28" y="148">[2] 1 Vocab Word</text>
      <rect x="22" y="158" width="156" height="18" rx="3" fill="#0c1411" stroke="#1f3a32"/><text x="28" y="170">[3] Quick Inspiration Log</text>
      <rect x="22" y="180" width="156" height="18" rx="3" fill="#0c1411" stroke="#1f3a32"/><text x="28" y="192">[4] Emotion Check-in</text>
    </g>
    <rect x="22" y="204" width="74" height="14" rx="3" fill="#0c1411" stroke="#2a4a40"/><text x="27" y="214" font-family="Consolas, monospace" font-size="7" fill="#dff5ea">[ESC] Home</text>
    <rect x="104" y="204" width="74" height="14" rx="3" fill="#0c1411" stroke="#2a4a40"/><text x="109" y="214" font-family="Consolas, monospace" font-size="7" fill="#7c9a8e">[&gt;] Continue 3s</text>
  </g>
</svg>
